server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: anything that is not a real file falls through to
  # index.html, or a refresh on /units returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is proxied through the same origin, so the browser never makes a
  # cross-origin request and there are no CORS headers to get wrong.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # AI drafting can take a while
    client_max_body_size 30m;         # evidence uploads: 10 files x 25 MB
  }

  location = /health { access_log off; return 200 "ok\n"; }

  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
